<!DOCTYPE html>
<html>
<head><title>Apply — Lever</title></head>
<body>
<form id="application_form" action="/submitted" method="post" enctype="multipart/form-data">
  <label for="name">Full name</label>
  <input id="name" name="name" />

  <label for="email">Email</label>
  <input id="email" name="email" type="email" />

  <label for="phone">Phone</label>
  <input id="phone" name="phone" />

  <label for="urls_linkedin">LinkedIn URL</label>
  <input id="urls_linkedin" name="urls[LinkedIn]" />

  <label for="urls_github">GitHub URL</label>
  <input id="urls_github" name="urls[GitHub]" />

  <label for="urls_portfolio">Portfolio</label>
  <input id="urls_portfolio" name="urls[Portfolio]" />

  <label for="resume">Resume / CV</label>
  <input id="resume" type="file" name="resume" />

  <label for="comments">Additional information</label>
  <textarea id="comments" name="comments"></textarea>

  <button type="submit" data-qa="btn-submit">Submit application</button>
</form>
<script>
  document.getElementById('application_form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.body.innerHTML =
      '<div data-qa="thanks"><h1>Thank you for applying</h1>' +
      '<p>We received your application.</p></div>';
  });
</script>
</body>
</html>

[project]
name = "hirescript-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.6.*",
    "sqlalchemy==2.0.*",
    "asyncpg==0.30.*",
    "psycopg[binary]==3.2.*",
    "alembic==1.14.*",
    "itsdangerous==2.2.*",
    "python-multipart==0.0.*",
    "pypdf==5.*",
    "claude-agent-sdk==0.1.*",
]

[project.optional-dependencies]
dev = ["pytest==8.*", "pytest-asyncio==0.24.*", "httpx==0.27.*", "aiosqlite==0.20.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

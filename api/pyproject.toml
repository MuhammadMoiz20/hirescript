[project]
name = "hirescript-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "email-validator==2.*",
    "pydantic-settings==2.6.*",
    "sqlalchemy==2.0.*",
    "asyncpg==0.30.*",
    "psycopg[binary]==3.2.*",
    "alembic==1.14.*",
    "itsdangerous==2.2.*",
    "python-multipart==0.0.*",
    "pypdf==5.*",
    "claude-agent-sdk==0.1.*",
    "anthropic==0.39.*",
    "aioimaplib==1.1.*",
    "boto3==1.35.*",
    "pgvector==0.3.*",
    "voyageai==0.3.*",
    "pylatexenc==2.10",
    "httpx==0.27.*",
    "beautifulsoup4==4.12.*",
    "playwright>=1.48,<2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.*", "pytest-asyncio==0.24.*", "httpx==0.27.*", "aiosqlite==0.20.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
